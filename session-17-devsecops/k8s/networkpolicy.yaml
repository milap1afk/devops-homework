# Default-deny ingress for the namespace, then allow only HTTP to the API Pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: kirana
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-http-to-api
  namespace: kirana
spec:
  podSelector:
    matchLabels: { app: kirana-catalog }
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 3000
          protocol: TCP
