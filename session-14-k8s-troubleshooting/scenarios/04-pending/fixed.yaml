apiVersion: apps/v1
kind: Deployment
metadata: { name: reports, namespace: s14 }
spec:
  replicas: 1
  selector: { matchLabels: { app: reports } }
  template:
    metadata: { labels: { app: reports } }
    spec:
      nodeSelector:
        disktype: ssd              # kept: the node is now labelled (kubectl label node minikube disktype=ssd)
      containers:
        - name: reports
          image: nginx:1.27-alpine
          resources:
            requests: { memory: 64Mi }
