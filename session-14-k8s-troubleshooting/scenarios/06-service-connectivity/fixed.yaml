apiVersion: apps/v1
kind: Deployment
metadata: { name: cart, namespace: s14 }
spec:
  replicas: 2
  selector: { matchLabels: { app: cart } }
  template:
    metadata: { labels: { app: cart } }
    spec:
      containers:
        - name: cart
          image: hashicorp/http-echo:1.0
          args: ["-listen=:5678", "-text=cart service OK"]
          ports: [{ containerPort: 5678 }]
---
apiVersion: v1
kind: Service
metadata: { name: cart, namespace: s14 }
spec:
  selector: { app: cart }
  ports:
    - port: 80
      targetPort: 5678
