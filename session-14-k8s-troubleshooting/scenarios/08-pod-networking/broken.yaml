apiVersion: v1
kind: Pod
metadata: { name: payments, namespace: s14, labels: { app: payments } }
spec:
  containers:
    - name: payments
      image: hashicorp/http-echo:1.0
      args: ["-listen=127.0.0.1:5678", "-text=payments OK"]   # loopback only: unreachable from other Pods
      ports: [{ containerPort: 5678 }]
