apiVersion: v1
kind: Secret
metadata: { name: smtp, namespace: s14 }
stringData:
  password: "demo-only"
---
apiVersion: v1
kind: Pod
metadata: { name: mailer, namespace: s14 }
spec:
  containers:
    - name: mailer
      image: busybox:1.36
      command: ["sh", "-c", "echo mailer started; sleep 3600"]
      env:
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef: { name: smtp, key: password }
