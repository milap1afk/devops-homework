apiVersion: apps/v1
kind: Deployment
metadata: { name: orders, namespace: s14 }
spec:
  replicas: 1
  selector: { matchLabels: { app: orders } }
  template:
    metadata: { labels: { app: orders } }
    spec:
      containers:
        - name: orders
          image: busybox:1.36
          env:
            - { name: DB_HOST, value: "mysql.s14.svc.cluster.local" }
          command: ["sh", "-c", 'if [ -z "$DB_HOST" ]; then echo "FATAL: DB_HOST is not set" >&2; exit 1; fi; echo "connected to $DB_HOST"; sleep 3600']
