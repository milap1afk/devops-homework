apiVersion: apps/v1
kind: Deployment
metadata: { name: catalog, namespace: s14 }
spec:
  replicas: 1
  selector: { matchLabels: { app: catalog } }
  template:
    metadata: { labels: { app: catalog } }
    spec:
      containers:
        - name: catalog
          image: docker.io/milap1afk/kirana-catalog-private:1.0   # repo does not exist / is private
