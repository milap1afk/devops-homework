apiVersion: v1
kind: Namespace
metadata:
  name: s11
---
# The application every Service in this session points at: 3 Pods that reply with their own name
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: s11
spec:
  replicas: 3
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:1.0
          args: ["-listen=:5678", "-text=hello from $(POD_NAME)"]
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
          ports: [{ containerPort: 5678, name: http }]
---
# Client Pod used to test connectivity from inside the cluster
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: s11
spec:
  containers:
    - name: tools
      image: nicolaka/netshoot:v0.13
      command: ["sleep", "infinity"]
