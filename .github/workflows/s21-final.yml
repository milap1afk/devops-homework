# Session 21 - Final DevOps project pipeline
# Build & test -> SAST -> SCA -> secret scan -> IaC scan -> Docker build -> image scan
#   -> security gate -> push image -> deploy with Helm to Kubernetes -> verify
name: "S21 Final DevOps Project"

on:
  push:
    branches: [main]
    paths:
      - "session-21-final-devops-project/final-devops-project/**"
      - ".github/workflows/s21-final.yml"
  pull_request:
    paths:
      - "session-21-final-devops-project/final-devops-project/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  P: session-21-final-devops-project/final-devops-project
  IMAGE: ghcr.io/${{ github.repository_owner }}/kirana-final
  TAG: ${{ github.sha }}

jobs:
  build-test:
    name: "1. Build & unit test"
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: "${{ env.P }}/application" } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "${{ env.P }}/application/requirements-dev.txt" }
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: flake8 .
      - name: Unit tests
        run: pytest -v --junitxml=junit.xml --cov=app --cov-report=term --cov-fail-under=80
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: s21-test-results, path: "${{ env.P }}/application/junit.xml" }

  sast:
    name: "2. SAST (Semgrep)"
    needs: build-test
    runs-on: ubuntu-latest
    container: { image: "semgrep/semgrep:1.179.0" }
    steps:
      - uses: actions/checkout@v7
      - run: |
          cp $P/security/.semgrepignore .semgrepignore
          semgrep scan --config p/python --config p/flask --config p/dockerfile --config p/secrets \
            --metrics off --error $P/application $P/docker

  sca:
    name: "3. SCA (pip-audit + Trivy fs)"
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: pip-audit (known vulnerable Python packages)
        run: pip install pip-audit && pip-audit -r $P/application/requirements.txt --strict
      - name: Trivy filesystem scan
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with: { scan-type: fs, scan-ref: "${{ env.P }}/application", trivy-config: "${{ env.P }}/security/trivy.yaml" }

  secret-scan:
    name: "4. Secret scan (Gitleaks)"
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Gitleaks (history + files of the project)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --log-opts="-- $P" \
            --config /repo/$P/security/.gitleaks.toml --redact --verbose --exit-code 1
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 dir /repo/$P \
            --config /repo/$P/security/.gitleaks.toml --redact --exit-code 1

  iac-scan:
    name: "5. IaC scan (Trivy config + terraform validate)"
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trivy misconfiguration scan (Helm chart, K8s manifests, Terraform, Dockerfile)
        uses: aquasecurity/trivy-action@v0.36.0
        with: { scan-type: config, scan-ref: "${{ env.P }}", trivy-config: "${{ env.P }}/security/trivy.yaml" }
      - uses: hashicorp/setup-terraform@v3
      - name: terraform fmt + validate
        working-directory: ${{ env.P }}/terraform
        run: terraform fmt -check -recursive && terraform init -backend=false -input=false && terraform validate
      - uses: azure/setup-helm@v4
      - name: helm lint
        run: helm lint $P/helm/kirana --set secrets.apiKey=x --set secrets.postgresPassword=y

  docker-build:
    name: "6. Docker build"
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ env.P }}
          file: ${{ env.P }}/docker/Dockerfile
          build-args: APP_VERSION=${{ github.sha }}
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          cache-from: type=gha,scope=s21
          cache-to: type=gha,scope=s21,mode=max
      - uses: actions/upload-artifact@v7
        with: { name: s21-image, path: "${{ runner.temp }}/image.tar", retention-days: 3 }

  image-scan:
    name: "7. Container image scan (Trivy)"
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: s21-image, path: "${{ runner.temp }}" }
      - uses: aquasecurity/trivy-action@v0.36.0
        with: { scan-type: image, input: "${{ runner.temp }}/image.tar", trivy-config: "${{ env.P }}/security/trivy.yaml" }

  security-gate:
    name: "8. Security gate"
    needs: [sast, sca, secret-scan, iac-scan, image-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          R: "${{ needs.sast.result }} ${{ needs.sca.result }} ${{ needs.secret-scan.result }} ${{ needs.iac-scan.result }} ${{ needs.image-scan.result }}"
        run: |
          echo "## 🔐 Security gate" >> "$GITHUB_STEP_SUMMARY"
          set -- $R
          for name in SAST SCA "Secret scan" "IaC scan" "Image scan"; do
            echo "- $name: $1" >> "$GITHUB_STEP_SUMMARY"; shift
          done
          for r in $R; do
            [ "$r" = success ] || { echo "::error::Security gate FAILED"; echo "**BLOCKED**" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          done
          echo "Security gate PASSED"; echo "**PASSED**" >> "$GITHUB_STEP_SUMMARY"

  push-image:
    name: "9. Push image (GHCR)"
    needs: [security-gate, docker-build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/download-artifact@v8
        with: { name: s21-image, path: "${{ runner.temp }}" }
      - uses: docker/login-action@v4
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - run: |
          docker load -i ${{ runner.temp }}/image.tar
          docker push $IMAGE:$TAG
          echo "Pushed \`$IMAGE:$TAG\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: "10. Deploy with Helm + verify"
    needs: push-image
    runs-on: ubuntu-latest
    environment: dev
    permissions: { contents: read, packages: read }
    steps:
      - uses: actions/checkout@v7
      - uses: helm/kind-action@v1
        with: { cluster_name: dev }
      - uses: azure/setup-helm@v4
      - name: Pull the scanned image into the cluster
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull $IMAGE:$TAG && kind load docker-image $IMAGE:$TAG --name dev
      - name: metrics-server (for the HPA)
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
          kubectl -n kube-system patch deploy metrics-server --type=json \
            -p '[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
      - name: helm upgrade --install
        env:
          API_KEY: ${{ secrets.KIRANA_API_KEY }}
        run: |
          helm upgrade --install kirana $P/helm/kirana -n kirana --create-namespace \
            --set image.tag=$TAG --set image.pullPolicy=IfNotPresent \
            --set secrets.apiKey="$API_KEY" --set secrets.postgresPassword="$(openssl rand -hex 16)" \
            --set monitoring.serviceMonitor=false --set monitoring.prometheusRule=false --set monitoring.grafanaDashboard=false \
            --wait --timeout 5m
          helm list -n kirana
          kubectl -n kirana get deploy,sts,svc,ingress,hpa,pvc,pods -o wide
      - name: Smoke test
        env:
          API_KEY: ${{ secrets.KIRANA_API_KEY }}
        run: |
          kubectl -n kirana port-forward svc/kirana-api 8080:80 >/dev/null 2>&1 &
          sleep 3
          curl -fsS localhost:8080/ready
          curl -fsS -X POST localhost:8080/entries -H 'Content-Type: application/json' -H "X-API-Key: $API_KEY" \
               -d '{"customer":"Ramesh bhai","amount":500,"type":"udhar"}'
          curl -fsS localhost:8080/balance/Ramesh | tee b.json; grep -q '"balance":500' b.json
          curl -fsS localhost:8080/metrics | grep kirana_ledger_entries_total
          echo "### Deployed \`$IMAGE:$TAG\` with Helm and passed the smoke test :rocket:" >> "$GITHUB_STEP_SUMMARY"
