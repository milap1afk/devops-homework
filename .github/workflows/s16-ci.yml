# Session 16 - Continuous Integration: lint -> test -> build -> push image
name: "S16 CI"

on:
  push:
    branches: [main]
    paths:
      - "session-16-cicd-github-actions/**"
      - ".github/workflows/s16-*.yml"
  pull_request:
    paths:
      - "session-16-cicd-github-actions/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_DIR: session-16-cicd-github-actions
  IMAGE: ghcr.io/${{ github.repository_owner }}/kirana-api

jobs:
  test:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}/app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ env.APP_DIR }}/app/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (flake8)
        run: flake8 .

      - name: Unit tests (pytest + coverage)
        run: pytest -v --junitxml=test-results.xml --cov=app --cov-report=term --cov-report=xml:coverage.xml

      - name: Upload test reports (artifact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            ${{ env.APP_DIR }}/app/test-results.xml
            ${{ env.APP_DIR }}/app/coverage.xml
          retention-days: 14

  build:
    name: Build & push Docker image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GitHub Container Registry
    outputs:
      image: ${{ env.IMAGE }}:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v7
        with:
          context: ${{ env.APP_DIR }}
          build-args: APP_VERSION=${{ github.sha }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the built image
        run: |
          docker run -d --name api -p 8000:8000 ${{ env.IMAGE }}:${{ github.sha }}
          for i in $(seq 20); do curl -fs localhost:8000/health && break; sleep 1; done
          curl -fs localhost:8000/health | grep '"status":"ok"'

      - name: Job summary
        run: |
          echo "### Image built :whale:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ env.IMAGE }}:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
