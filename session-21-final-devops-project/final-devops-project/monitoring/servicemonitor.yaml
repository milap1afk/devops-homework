# Rendered from ../helm/kirana (helm template kirana helm/kirana -f values-minikube.yaml). Edit the chart, not this file.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kirana-api
  labels:
    app.kubernetes.io/name: kirana
    app.kubernetes.io/instance: kirana
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: kirana-1.0.0
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: kirana
      app.kubernetes.io/component: api
  endpoints:
    - { port: http, path: /metrics, interval: 15s }
