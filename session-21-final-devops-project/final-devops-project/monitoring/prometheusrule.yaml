# Rendered from ../helm/kirana by kubernetes/render.sh. Edit the chart, not this file.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kirana-alerts
  labels:
    app.kubernetes.io/name: kirana
    app.kubernetes.io/instance: kirana
    app.kubernetes.io/part-of: kirana
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: kirana-2.0.0
spec:
  groups:
    - name: kirana.rules
      rules:
        - alert: KiranaBackendDown
          expr: sum(up{service="kirana-backend"}) == 0 or absent(up{service="kirana-backend"})
          for: 1m
          labels: { severity: critical }
          annotations: { summary: "Kirana backend has no healthy scrape targets" }
        - alert: KiranaHighErrorRate
          expr: |
            sum(rate(http_requests_total{service="kirana-backend", status="5xx"}[5m]))
              / clamp_min(sum(rate(http_requests_total{service="kirana-backend"}[5m])), 1e-9) > 0.05
          for: 2m
          labels: { severity: warning }
          annotations: { summary: "More than 5% of Kirana API requests are failing" }
        - alert: KiranaSlowRequests
          expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{service="kirana-backend"}[5m])) by (le)) > 0.5
          for: 5m
          labels: { severity: warning }
          annotations: { summary: "Kirana API p95 latency above 500ms" }
