{{- $sel := dict "root" . "component" "backend" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kirana.name" . }}-backend
  labels: {{- include "kirana.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
    app.kubernetes.io/version: {{ .Values.backend.image.tag | default .Chart.AppVersion | quote }}
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  selector:
    matchLabels: {{- include "kirana.selector" $sel | nindent 6 }}
  template:
    metadata:
      labels: {{- include "kirana.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "kirana.podSecurity" . | nindent 8 }}
        runAsUser: 10001
      initContainers:
        # wait for PostgreSQL, then apply Alembic migrations (advisory lock: safe with many replicas)
        - name: migrate
          image: {{ include "kirana.backendImage" . }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["sh", "-c", "until alembic upgrade head; do echo 'database not ready, retrying in 3s'; sleep 3; done"]
          envFrom: &envFrom
            - configMapRef: { name: {{ include "kirana.name" . }}-config }
          env: &env
            - name: API_KEY
              valueFrom: { secretKeyRef: { name: {{ include "kirana.secretName" . }}, key: API_KEY } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "kirana.secretName" . }}, key: POSTGRES_PASSWORD } }
            - name: DATABASE_URL
              value: "postgresql+psycopg://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):5432/$(POSTGRES_DB)"
            - name: APP_VERSION
              value: {{ .Values.backend.image.tag | default .Chart.AppVersion | quote }}
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext: {{- include "kirana.containerSecurity" . | nindent 12 }}
      containers:
        - name: backend
          image: {{ include "kirana.backendImage" . }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports: [{ name: http, containerPort: 8000 }]
          envFrom: *envFrom
          env: *env
          {{- with .Values.backend.probes }}
          startupProbe:
            httpGet: { path: {{ .startup.path }}, port: http }
            failureThreshold: {{ .startup.failureThreshold }}
            periodSeconds: {{ .startup.periodSeconds }}
            timeoutSeconds: {{ .startup.timeoutSeconds }}
          livenessProbe:
            httpGet: { path: {{ .liveness.path }}, port: http }
            initialDelaySeconds: {{ .liveness.initialDelaySeconds }}
            periodSeconds: {{ .liveness.periodSeconds }}
            timeoutSeconds: {{ .liveness.timeoutSeconds }}
            failureThreshold: {{ .liveness.failureThreshold }}
          readinessProbe:
            httpGet: { path: {{ .readiness.path }}, port: http }
            initialDelaySeconds: {{ .readiness.initialDelaySeconds }}
            periodSeconds: {{ .readiness.periodSeconds }}
            timeoutSeconds: {{ .readiness.timeoutSeconds }}
          {{- end }}
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext: {{- include "kirana.containerSecurity" . | nindent 12 }}
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kirana.name" . }}-backend
  labels: {{- include "kirana.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  selector: {{- include "kirana.selector" $sel | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.service.backendPort }}, targetPort: http }
