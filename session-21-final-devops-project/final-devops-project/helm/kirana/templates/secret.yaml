{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kirana.secretName" . }}
  labels: {{- include "kirana.labels" . | nindent 4 }}
type: Opaque
stringData:
  API_KEY: {{ required "set secrets.apiKey (or secrets.existingSecret)" .Values.secrets.apiKey | quote }}
  POSTGRES_PASSWORD: {{ required "set secrets.postgresPassword (or secrets.existingSecret)" .Values.secrets.postgresPassword | quote }}
{{- end }}
