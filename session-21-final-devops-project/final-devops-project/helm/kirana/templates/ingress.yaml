{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "kirana.name" . }}
  labels: {{- include "kirana.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api               # API calls -> FastAPI backend
            pathType: Prefix
            backend: { service: { name: {{ include "kirana.name" . }}-backend, port: { name: http } } }
          - path: /                  # everything else -> web UI
            pathType: Prefix
            backend: { service: { name: {{ include "kirana.name" . }}-frontend, port: { name: http } } }
{{- end }}
