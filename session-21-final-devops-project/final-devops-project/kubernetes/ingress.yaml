# Rendered from ../helm/kirana by kubernetes/render.sh. Edit the chart, not this file.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kirana
  labels:
    app.kubernetes.io/name: kirana
    app.kubernetes.io/instance: kirana
    app.kubernetes.io/part-of: kirana
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: kirana-2.0.0
spec:
  ingressClassName: nginx
  rules:
    - host: kirana.local
      http:
        paths:
          - path: /api               # API calls -> FastAPI backend
            pathType: Prefix
            backend: { service: { name: kirana-backend, port: { name: http } } }
          - path: /                  # everything else -> web UI
            pathType: Prefix
            backend: { service: { name: kirana-frontend, port: { name: http } } }
