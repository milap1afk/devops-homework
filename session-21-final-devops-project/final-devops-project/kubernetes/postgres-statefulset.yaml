# Rendered from ../helm/kirana by kubernetes/render.sh. Edit the chart, not this file.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kirana-postgres
  labels:
    app.kubernetes.io/name: kirana
    app.kubernetes.io/instance: kirana
    app.kubernetes.io/version: "1.0.2"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: kirana-1.0.2
    app.kubernetes.io/component: postgres
spec:
  serviceName: kirana-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: kirana
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kirana
        app.kubernetes.io/instance: kirana
        app.kubernetes.io/version: "1.0.2"
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: kirana-1.0.2
        app.kubernetes.io/component: postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70        # "postgres" user in the alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: postgres:17-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          ports: [{ name: postgres, containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: "ledger" }
            - { name: POSTGRES_USER, value: "kirana" }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: kirana-secrets, key: POSTGRES_PASSWORD } }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"] }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }   # unix socket + lock file
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: run, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: { storage: 1Gi }
