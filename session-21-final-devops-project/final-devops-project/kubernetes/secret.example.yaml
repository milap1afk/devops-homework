# Shape of the Secret expected by ../helm/kirana (helm template kirana helm/kirana -f values-minikube.yaml).
# NEVER commit real values. Create it out-of-band:
#   kubectl -n kirana create secret generic kirana-secrets \
#     --from-literal=API_KEY="$(openssl rand -hex 16)" --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 16)"
apiVersion: v1
kind: Secret
metadata:
  name: kirana-secrets
  namespace: kirana
type: Opaque
stringData:
  API_KEY: "<set-at-deploy-time>"
  POSTGRES_PASSWORD: "<set-at-deploy-time>"
