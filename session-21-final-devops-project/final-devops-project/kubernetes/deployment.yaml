# Rendered from ../helm/kirana (helm template kirana helm/kirana -f values-minikube.yaml). Edit the chart, not this file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kirana-api
  labels:
    app.kubernetes.io/name: kirana
    app.kubernetes.io/instance: kirana
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: kirana-1.0.0
    app.kubernetes.io/component: api
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: kirana
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kirana
        app.kubernetes.io/instance: kirana
        app.kubernetes.io/version: "1.0.0"
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: kirana-1.0.0
        app.kubernetes.io/component: api
      annotations:
        checksum/config: 6d622d24984b491082b132b4b5289986348f876276293a96f80223ccff6c9222
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: "ghcr.io/milap1afk/kirana-final:1.0.0"
          imagePullPolicy: Never
          ports:
            - { name: http, containerPort: 8000 }
          envFrom:
            - configMapRef: { name: kirana-config }
          env:
            - name: API_KEY
              valueFrom: { secretKeyRef: { name: kirana-secrets, key: API_KEY } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: kirana-secrets, key: POSTGRES_PASSWORD } }
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):5432/$(POSTGRES_DB)"
            - name: APP_VERSION
              value: "1.0.0"
          startupProbe:
            httpGet: { path: /health, port: http }
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            limits:
              cpu: 500m
              memory: 192Mi
            requests:
              cpu: 50m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }     # gunicorn worker temp files
      volumes:
        - name: tmp
          emptyDir: {}
