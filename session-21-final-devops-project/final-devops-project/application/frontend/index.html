<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kirana Ledger</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <h1 id="shop">Kirana Ledger</h1>
      <span id="version" class="muted"></span>
    </header>
    <main>
      <section class="card">
        <h2>New entry</h2>
        <form id="entry-form">
          <input id="customer" placeholder="Customer (e.g. Ramesh bhai)" required maxlength="80" />
          <input id="amount" type="number" min="1" step="0.01" placeholder="Amount ₹" required />
          <div class="types">
            <label><input type="radio" name="type" value="udhar" checked /> उधार udhar</label>
            <label><input type="radio" name="type" value="payment" /> वापस payment</label>
            <label><input type="radio" name="type" value="sale" /> बिक्री sale</label>
          </div>
          <input id="note" placeholder="Note (optional)" maxlength="200" />
          <input id="apikey" type="password" placeholder="Shop API key" autocomplete="off" />
          <button type="submit" id="save">Save entry</button>
          <p id="form-msg" class="msg"></p>
        </form>
      </section>

      <section class="card">
        <h2>कौन कितना बाकी</h2>
        <ul id="balances" class="list"></ul>
      </section>

      <section class="card">
        <h2>Entries</h2>
        <ul id="entries" class="list"></ul>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
