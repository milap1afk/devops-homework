# One entry point, routing by HOST and by PATH:
#   http://kirana.local/shop  -> shop-svc
#   http://kirana.local/blog  -> blog-svc
#   http://blog.kirana.local/ -> blog-svc
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-ingress
  namespace: s12
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx            # handled by the ingress-nginx controller
  rules:
    - host: kirana.local
      http:
        paths:
          - path: /shop
            pathType: Prefix
            backend: { service: { name: shop-svc, port: { number: 80 } } }
          - path: /blog
            pathType: Prefix
            backend: { service: { name: blog-svc, port: { number: 80 } } }
    - host: blog.kirana.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: blog-svc, port: { number: 80 } } }
