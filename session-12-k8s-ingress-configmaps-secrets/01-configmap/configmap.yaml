apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: s12
data:
  # simple key/value pairs
  APP_ENV: "production"
  APP_COLOR: "blue"
  LOG_LEVEL: "info"
  MAX_CONNECTIONS: "100"
  # a whole config file as one key
  app.properties: |
    feature.dark_mode=true
    feature.beta_banner=false
    cache.ttl_seconds=300
