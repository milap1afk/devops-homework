apiVersion: v1
kind: Pod
metadata:
  name: secret-demo
  namespace: s12
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      env:
        - name: DB_USER
          valueFrom:
            secretKeyRef: { name: db-credentials, key: DB_USER }
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef: { name: db-credentials, key: DB_PASSWORD }
      volumeMounts:
        - name: secret-volume
          mountPath: /etc/secrets
          readOnly: true
  volumes:
    - name: secret-volume
      secret:
        secretName: db-credentials
        defaultMode: 0400               # files readable only by the owner
