# EXAMPLE ONLY - placeholder values. The real secret is created from the command line
# (see README) so no real credential is ever committed to Git.
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: s12
type: Opaque
stringData:                     # plain text here; Kubernetes stores it base64-encoded in .data
  DB_USER: "appuser"
  DB_PASSWORD: "change-me"
