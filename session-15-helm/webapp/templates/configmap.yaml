apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "webapp.fullname" . }}-page
  labels:
    {{- include "webapp.labels" . | nindent 4 }}
data:
  index.html: |
    <!DOCTYPE html>
    <html>
      <head><title>{{ .Values.page.title }}</title></head>
      <body style="font-family: sans-serif; background: {{ .Values.page.color }}; color: white; padding: 40px">
        <h1>{{ .Values.page.title }}</h1>
        <p>{{ .Values.page.message }}</p>
        <p>version: {{ .Values.page.version }} | release: {{ .Release.Name }} | revision: {{ .Release.Revision }} | chart: {{ .Chart.Name }}-{{ .Chart.Version }}</p>
      </body>
    </html>
