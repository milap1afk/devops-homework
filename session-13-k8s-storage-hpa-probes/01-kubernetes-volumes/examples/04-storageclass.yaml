# A custom StorageClass using minikube's provisioner, with reclaimPolicy Retain
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: fast-retain
provisioner: k8s.io/minikube-hostpath      # on AWS this would be ebs.csi.aws.com
reclaimPolicy: Retain                      # keep the disk after the PVC is deleted
volumeBindingMode: Immediate
allowVolumeExpansion: true
