# emptyDir: scratch space shared by containers in ONE Pod; deleted with the Pod
apiVersion: v1
kind: Pod
metadata: { name: emptydir-demo, namespace: s13 }
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "while true; do date >> /data/log.txt; sleep 2; done"]
      volumeMounts: [{ name: shared, mountPath: /data }]
    - name: reader
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts: [{ name: shared, mountPath: /input, readOnly: true }]
  volumes:
    - name: shared
      emptyDir: {}            # add `medium: Memory` for a RAM-backed tmpfs
