# Application + Service + HorizontalPodAutoscaler
apiVersion: apps/v1
kind: Deployment
metadata:
  name: php-apache
  namespace: s13
spec:
  selector:
    matchLabels: { run: php-apache }
  template:
    metadata:
      labels: { run: php-apache }
    spec:
      containers:
        - name: php-apache
          image: hpa-example:local
          imagePullPolicy: Never
          ports: [{ containerPort: 80 }]
          resources:
            requests: { cpu: 200m }    # HPA % is measured against this request
            limits:   { cpu: 500m }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: php-apache
  namespace: s13
spec:
  selector: { run: php-apache }
  ports: [{ port: 80 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: php-apache
  namespace: s13
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: php-apache
  minReplicas: 1
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50       # keep average CPU at 50% of the request
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60   # default is 300s; shortened for the demo
