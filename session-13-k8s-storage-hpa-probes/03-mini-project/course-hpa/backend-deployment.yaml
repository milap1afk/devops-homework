# Not in the course hpa/ folder: backend-service.yaml and hpa-backend.yaml target a Deployment
# "yatri-backend" (port 5000, /healthz) that comes from Session 12. This is a minimal version of it:
# the Session 12 Python HTTP backend without the ConfigMap/Secret, with a CPU request so the HPA can compute %.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yatri-backend
  labels:
    app: yatri-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: yatri-backend
  template:
    metadata:
      labels:
        app: yatri-backend
    spec:
      containers:
        - name: backend
          image: python:3.12-alpine
          command: ["python3", "-c"]
          args:
            - |
              import os, socket
              from http.server import HTTPServer, BaseHTTPRequestHandler
              class H(BaseHTTPRequestHandler):
                  def log_message(self, *a): pass
                  def do_GET(self):
                      body = ('ok from ' + socket.gethostname() + '\n').encode()
                      self.send_response(200); self.send_header('Content-Length', str(len(body))); self.end_headers()
                      self.wfile.write(body)
              HTTPServer(('0.0.0.0', 5000), H).serve_forever()
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet: {path: /healthz, port: 5000}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
