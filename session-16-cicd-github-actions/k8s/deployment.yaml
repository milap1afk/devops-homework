apiVersion: apps/v1
kind: Deployment
metadata:
  name: kirana-api
  labels: { app: kirana-api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: kirana-api }
  template:
    metadata:
      labels: { app: kirana-api }
    spec:
      containers:
        - name: api
          image: IMAGE_PLACEHOLDER          # replaced by the CD pipeline with the exact image built by CI
          ports: [{ containerPort: 8000 }]
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef: { name: kirana-api-secret, key: API_KEY }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
