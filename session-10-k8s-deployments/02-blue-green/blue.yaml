apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-blue
spec:
  replicas: 2
  selector:
    matchLabels: { app: shop, version: blue }
  template:
    metadata:
      labels: { app: shop, version: blue }
    spec:
      containers:
        - name: app
          image: hashicorp/http-echo:1.0
          args: ["-text=Hello from BLUE (v1)", "-listen=:5678"]
          ports: [{ containerPort: 5678 }]
