# Init containers run to completion, in order, BEFORE the main container starts.
# STATUS shows Init:0/2 -> Init:1/2 -> PodInitializing -> Running
apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-init
spec:
  initContainers:
    - name: wait-a-bit
      image: busybox:1.36
      command: ["sh", "-c", "echo init 1; sleep 8"]
    - name: write-config
      image: busybox:1.36
      command: ["sh", "-c", "echo 'hello from init' > /work/index.html"]
      volumeMounts: [{ name: work, mountPath: /work }]
  containers:
    - name: web
      image: nginx:1.26
      volumeMounts: [{ name: work, mountPath: /usr/share/nginx/html }]
  volumes:
    - name: work
      emptyDir: {}
